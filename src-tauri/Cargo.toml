[package]
name = "icon-forge"
description = "Icon Forge — offline icon vectorization studio (Tauri shell: commands, job-engine wiring)"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "icon_forge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "icon-forge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Pinned to the npm side's minor on purpose: the Tauri CLI refuses to bundle
# when the `tauri` crate and `@tauri-apps/api` are not on the same major/minor,
# and this workspace does not commit Cargo.lock, so a bare "2" silently floats
# (measured: it moved 2.11 -> 2.12.1 between two otherwise identical runs and
# broke the installer build). Keep this in step with package.json; the tilde
# still takes patch releases of the same minor.
tauri = { version = "~2.12.1", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
isg-core = { workspace = true }
isg-native = { path = "../crates/isg-native" }
