# Icon Forge CI — Windows-first (the only shipping platform).
#
# * windows-latest: primary leg — frontend (typecheck, tests, build — dist/
#   is a compile-time input of tauri's generate_context!), Rust build,
#   tests (incl. the Phase 0 exit gate and the Phase 1 exit-criteria tests:
#   10k import + kill-mid-save), spike benchmark, corpus regeneration
#   consistency, wasm32 keystone check, fmt (BLOCKING since Phase 1),
#   clippy.
# * ubuntu-latest: quick leg — keystone check for every native crate except
#   the Tauri shell (webview deps are Windows-only here) + license policy
#   (cargo-deny-action is a container action, Linux-only; license analysis
#   reads Cargo.lock metadata and is platform-independent).
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-primary:
    name: "Windows (primary): frontend + build + tests + benchmark + gates"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Frontend (typecheck, unit tests, build)
        shell: bash
        run: |
          npm ci
          npm run typecheck
          npm run test
          npm run build

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: cargo-win-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-win-${{ runner.os }}-

      - name: Check (release, workspace)
        run: cargo check --workspace --release

      - name: Tests (release) — Phase 0 gate + Phase 1 exit-criteria tests
        # --nocapture: the exit-gate tests eprintln their measured
        # numbers as evidence; libtest hides passing tests' output.
        # --no-fail-fast is permanent: a failing test must not hide the other
        # gates' evidence. `tee` keeps the log AND feeds the job summary
        # below; `pipefail` preserves the test exit status through the pipe.
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --release --no-fail-fast -- --nocapture 2>&1 | tee target/test-evidence.txt

      - name: Corpus regeneration consistency (truth JSONs must be byte-identical)
        shell: bash
        run: |
          cargo run -p isg-gen-corpus --release -- --out target/regen-corpus
          status=0
          for f in target/regen-corpus/*.json; do
            diff -u "bench/corpus/$(basename "$f")" "$f" || status=1
          done
          exit $status

      - name: Spike benchmark — Phase 0 exit gate (exact counts, C2 keystone <= 2.0 s; JSON report in logs)
        shell: bash
        run: |
          set -o pipefail
          cargo run -p isg-spike-groupall --release -- --corpus bench/corpus --json 2>&1 | tee target/spike-evidence.json

      # The raw log download lives on *.blob.core.windows.net, which some
      # network-isolated review sandboxes cannot reach (TLS reset at the
      # egress proxy). The job summary is served through the GitHub API
      # instead, so the run's own evidence numbers stay reviewable from
      # anywhere: gh api .../commits/<sha>/check-runs --jq '.check_runs[].output.summary'
      - name: Evidence → job summary + annotation (API-readable)
        if: always()
        shell: bash
        run: |
          EVIDENCE=$(grep -hE 'evidence:|^C[0-9]+ |^W[0-9]+ |peak RSS|SSIM|GAP=' \
            target/test-evidence.txt 2>/dev/null | head -100 || true)
          if [ -z "$EVIDENCE" ]; then
            EVIDENCE=$(tail -100 target/test-evidence.txt 2>/dev/null || true)
          fi
          {
            echo "## Evidence (run-produced)"
            echo '```text'
            printf '%s\n' "$EVIDENCE"
            echo '```'
            echo '```json'
            tail -c 3000 target/spike-evidence.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # A job's markdown summary is NOT exposed through the GitHub API
          # (the job's check-run `output.summary` stays null), but annotations
          # are. So the same block is republished as one notice annotation,
          # which a network-isolated reviewer can read with:
          #   gh api /repos/<owner>/<repo>/check-runs/<job_id>/annotations
          MSG=$(printf '%s' "$EVIDENCE" | head -c 60000 \
            | sed -e 's/%/%25/g' -e 's/\r/%0D/g' \
            | awk '{printf "%s%%0A", $0}')
          echo "::notice title=Icon Forge evidence::${MSG}"

      - name: "Keystone: isg-core compiles for wasm32-unknown-unknown"
        run: cargo check --target wasm32-unknown-unknown -p isg-core

      # Blocking since Phase 1 (was report-only in Phase 0): the dev sandbox
      # has no rustfmt, so formatting is verified here and fixed from the
      # reported diffs.
      - name: Format check (blocking since Phase 1)
        run: cargo fmt --all --check

      - name: Clippy (workspace, release)
        run: cargo clippy --workspace --release -- -D warnings

  ubuntu-quick:
    name: "Ubuntu (quick): native keystone checks + license policy"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: cargo-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-linux-

      - name: "Keystone: isg-core compiles for wasm32-unknown-unknown"
        run: cargo check --target wasm32-unknown-unknown -p isg-core

      # The Tauri shell is excluded on this leg: its system webview deps
      # (webkit2gtk et al.) are not installed here, and the only shipping
      # platform is Windows. Every other workspace crate must be clean.
      - name: Check all non-Tauri crates
        run: cargo check -p isg-core -p isg-native -p isg-spike-groupall -p isg-gen-corpus

      # Lives on this leg because cargo-deny-action is a container action
      # (Linux-only on GitHub runners). Policy identical on every platform:
      # default-deny licenses + structural copyleft ban (deny.toml).
      - name: "License policy (cargo-deny: GPL/AGPL hard ban)"
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
