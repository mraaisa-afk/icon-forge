# Icon Forge CI — Windows-first (the only shipping platform).
#
# * windows-latest: primary leg — frontend (typecheck, tests, build — dist/
#   is a compile-time input of tauri's generate_context!), Rust build,
#   tests (incl. the Phase 0 exit gate and the Phase 1 exit-criteria tests:
#   10k import + kill-mid-save), spike benchmark, corpus regeneration
#   consistency, wasm32 keystone check, fmt (BLOCKING since Phase 1),
#   clippy.
# * ubuntu-latest: quick leg — keystone check for every native crate except
#   the Tauri shell (webview deps are Windows-only here) + license policy
#   (cargo-deny-action is a container action, Linux-only; license analysis
#   reads Cargo.lock metadata and is platform-independent).
name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-primary:
    name: "Windows (primary): frontend + build + tests + benchmark + gates"
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node toolchain
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Frontend (typecheck, unit tests, build)
        shell: bash
        run: |
          npm ci
          npm run typecheck
          # The suite's `evidence:` lines go to their own file: the Rust step
          # below overwrites target/test-evidence.txt, which would take the
          # frontend's numbers with it, and the review workspace's evidence is
          # the only record of the phase-6 UI half.
          mkdir -p target
          # Colour is stripped before anything is recorded: vitest emits ANSI
          # escapes on the runner, and an evidence line that arrives as
          # `\u001b[22m\u001b[39mevidence: …` is one a reviewer has to clean by
          # hand before quoting it.
          npm run test 2>&1 \
            | sed -e 's/\x1b\[[0-9;]*m//g' \
            | tee target/ui-evidence.txt
          npm run build

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt clippy

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: cargo-win-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-win-${{ runner.os }}-

      - name: Check (release, workspace)
        run: cargo check --workspace --release

      # Phase 7: the code's half of "USB install with networking disabled".
      # Runs after the check above, so Cargo.lock exists and the transitive half
      # of the dependency check is live rather than reported absent.
      - name: Offline verification — the app holds no network capability
        shell: bash
        run: |
          set -o pipefail
          PY=$(command -v python3 || command -v python)
          "$PY" tools/offline_check.py 2>&1 | tee target/offline-evidence.txt

      # Phase 4 adds the editor: the same keystone now covers the crate that
      # actually ships as WebAssembly.
      - name: "Keystone: isg-core + isg-wasm compile for wasm32-unknown-unknown"
        run: cargo check --target wasm32-unknown-unknown -p isg-core -p isg-wasm

      # The Rust tests exercise the ABI through the same dispatcher, but they
      # cannot prove the thing that ships: this builds the artifact and runs
      # *those bytes* under Node (already installed for the frontend step), so a
      # renamed export, a missing `memory`, or tables the host cannot see fail
      # here instead of in a user's webview.
      - name: "Editor ABI: build the wasm artifact, run it in Node and in the adapter tests"
        shell: bash
        run: |
          set -o pipefail
          set -e
          cargo build --release --target wasm32-unknown-unknown -p isg-wasm
          {
            node crates/isg-wasm/tests/wasm_smoke.mjs
            # The adapter tests are fatal about the artifact here (they skip it
            # in the earlier frontend step, which runs before Rust exists).
            ISG_REQUIRE_WASM=1 \
              ISG_WASM_PATH=target/wasm32-unknown-unknown/release/isg_wasm.wasm \
              npm test -- src/wasm src/state/editorStore.test.ts
          } 2>&1 | tee target/editor-evidence.txt

      - name: Tests (release) — Phase 0 gate + Phase 1 exit-criteria tests
        # --nocapture: the exit-gate tests eprintln their measured
        # numbers as evidence; libtest hides passing tests' output.
        # --no-fail-fast is permanent: a failing test must not hide the other
        # gates' evidence. `tee` keeps the log AND feeds the job summary
        # below; `pipefail` preserves the test exit status through the pipe.
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --release --no-fail-fast -- --nocapture 2>&1 | tee target/test-evidence.txt

      - name: Corpus regeneration consistency (truth JSONs must be byte-identical)
        shell: bash
        run: |
          cargo run -p isg-gen-corpus --release -- --out target/regen-corpus
          status=0
          for f in target/regen-corpus/*.json; do
            diff -u "bench/corpus/$(basename "$f")" "$f" || status=1
          done
          exit $status

      - name: Spike benchmark — Phase 0 exit gate (exact counts, C2 keystone <= 2.0 s; JSON report in logs)
        shell: bash
        run: |
          set -o pipefail
          cargo run -p isg-spike-groupall --release -- --corpus bench/corpus --json 2>&1 | tee target/spike-evidence.json

      # The raw log download lives on *.blob.core.windows.net, which some
      # network-isolated review sandboxes cannot reach (TLS reset at the
      # egress proxy). The job summary is served through the GitHub API
      # instead, so the run's own evidence numbers stay reviewable from
      # anywhere: gh api .../commits/<sha>/check-runs --jq '.check_runs[].output.summary'
      - name: Evidence → job summary + annotation (API-readable)
        if: always()
        shell: bash
        run: |
          # The editor's evidence is gathered across both files, so the phase
          # under review is never pushed out of the summary by an older one,
          # and split by who produced it: the artifact lines come from running
          # the built module under Node, the adapter lines from the TypeScript
          # suite (frame budget, property walks) and the host-side ABI tests.
          # They get two notices because one ~4 KiB body cannot hold both
          # without cutting the last line mid-sentence.
          ARTIFACT=$(grep -hE '^ok |^FAIL |evidence: wasm artifact' \
            target/editor-evidence.txt 2>/dev/null | head -60 || true)
          ADAPTER=$(grep -hE 'evidence: editor' \
            target/editor-evidence.txt target/test-evidence.txt 2>/dev/null \
            | head -40 || true)
          EVIDENCE=$(grep -hE 'evidence:|^C[0-9]+ |^W[0-9]+ |peak RSS|SSIM|GAP=' \
            target/test-evidence.txt 2>/dev/null | head -100 || true)
          if [ -z "$EVIDENCE" ]; then
            EVIDENCE=$(tail -100 target/test-evidence.txt 2>/dev/null || true)
          fi
          # The phase-5 exit criteria have their own notice: the phase-specific
          # lines (`evidence: phase5 …`) are printed last by the suite, so in
          # the combined notice above they fall past the ~4 KiB cut and become
          # unreachable through the API. One notice per phase under review is
          # the convention here (see the editor's two).
          PHASE5=$(grep -hE 'evidence: phase5' \
            target/test-evidence.txt 2>/dev/null | head -20 || true)
          # Phase 6 gets two: the test prints the sixteen per-icon lines its own
          # failure needs, then one summary line per criterion, and sharing a
          # single ~4 KiB body would push the summaries — the numbers an exit
          # report quotes — past the cut.
          PHASE6=$(grep -hE 'evidence: phase6' \
            target/test-evidence.txt 2>/dev/null | head -20 || true)
          PHASE6CRIT=$(grep -hE 'evidence: phase6 G[0-9]' \
            target/test-evidence.txt 2>/dev/null \
            | grep -E 'separation|funnel|icons=|G1c|variants|decisions=' \
            | head -12 || true)
          # The phase-6 *UI* half comes from the TypeScript suite, which writes
          # its own file: the review workspace's keyboard table, its triage
          # store and its browser fallback are what no Rust gate can see.
          REVIEWUI=$(grep -hE 'evidence: review' \
            target/ui-evidence.txt 2>/dev/null | head -20 || true)
          # Phase 7's offline verification prints its own lines, from two files:
          # the gate's verdicts (present on both legs) and the negative controls
          # (Ubuntu leg, where the self-test runs).
          PHASE7=$(grep -hE 'evidence: phase7' \
            target/offline-evidence.txt target/offline-selftest-evidence.txt \
            2>/dev/null | head -20 || true)
          {
            echo "## Evidence (run-produced)"
            echo '```text'
            printf '%s\n' "$ARTIFACT"
            printf '%s\n' "$ADAPTER"
            printf '%s\n' "$EVIDENCE"
            printf '%s\n' "$PHASE5"
            printf '%s\n' "$PHASE6"
            printf '%s\n' "$PHASE6CRIT"
            printf '%s\n' "$REVIEWUI"
            printf '%s\n' "$PHASE7"
            echo '```'
            echo '```json'
            tail -c 3000 target/spike-evidence.json 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # A job's markdown summary is NOT exposed through the GitHub API
          # (the job's check-run `output.summary` stays null), but annotations
          # are. A network-isolated reviewer reads them with:
          #   gh api /repos/<owner>/<repo>/check-runs/<job_id>/annotations
          # A workflow-command notice is truncated at roughly 4 KiB, so each
          # phase gets its own notice rather than sharing one: the editor
          # numbers went missing the first time because a truncated line ate
          # them.
          announce() {
            local body
            # The ANSI strip is belt-and-braces: the frontend step already
            # cleans its own file, but cargo colours its output too, and the
            # notices are read through the API by a reviewer who should not
            # have to strip escapes to quote a number.
            body=$(printf '%s' "$2" | head -c 3600 \
              | sed -e 's/\x1b\[[0-9;]*m//g' -e 's/%/%25/g' -e 's/\r/%0D/g' \
              | awk '{printf "%s%%0A", $0}')
            echo "::notice title=$1::${body}"
          }
          announce "Icon Forge editor artifact evidence" "$ARTIFACT"
          announce "Icon Forge editor adapter evidence" "$ADAPTER"
          announce "Icon Forge evidence" "$EVIDENCE"
          announce "Icon Forge phase 5 evidence" "$PHASE5"
          announce "Icon Forge phase 6 evidence" "$PHASE6"
          announce "Icon Forge phase 6 criteria" "$PHASE6CRIT"
          announce "Icon Forge phase 6 review workspace" "$REVIEWUI"
          announce "Icon Forge phase 7 offline verification" "$PHASE7"

      # Blocking since Phase 1 (was report-only in Phase 0): the dev sandbox
      # has no rustfmt, so formatting is verified here and fixed from the
      # reported diffs.
      - name: Format check (blocking since Phase 1)
        run: cargo fmt --all --check

      - name: Clippy (workspace, release)
        run: cargo clippy --workspace --release -- -D warnings

  ubuntu-quick:
    name: "Ubuntu (quick): native keystone checks + license policy"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: cargo-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-linux-

      # Checked *and* linked here: `cargo check` alone would not notice a
      # cdylib that builds but cannot produce a wasm artifact.
      - name: "Keystone: isg-core + isg-wasm compile and link for wasm32-unknown-unknown"
        run: |
          cargo check --target wasm32-unknown-unknown -p isg-core -p isg-wasm
          cargo build --release --target wasm32-unknown-unknown -p isg-wasm

      # The Tauri shell is excluded on this leg: its system webview deps
      # (webkit2gtk et al.) are not installed here, and the only shipping
      # platform is Windows. Every other workspace crate must be clean.
      - name: Check all non-Tauri crates
        run: cargo check -p isg-core -p isg-wasm -p isg-native -p isg-spike-groupall -p isg-gen-corpus

      # Phase 7, both halves: the gate itself, then the proof that the gate can
      # fail. `offline_check_selftest.py` copies the tree, re-introduces each
      # network capability the gate claims to catch and requires a rejection for
      # the stated reason — a check that has never rejected anything is not
      # evidence. Lives on this leg because it is pure Python and needs no
      # Windows toolchain.
      - name: "Offline verification + negative controls"
        shell: bash
        run: |
          set -o pipefail
          PY=$(command -v python3 || command -v python)
          "$PY" tools/offline_check.py 2>&1 | tee target/offline-evidence.txt
          "$PY" tools/offline_check_selftest.py 2>&1 | tee target/offline-selftest-evidence.txt

      # Lives on this leg because cargo-deny-action is a container action
      # (Linux-only on GitHub runners). Policy identical on every platform:
      # default-deny licenses + structural copyleft ban (deny.toml).
      - name: "License policy (cargo-deny: GPL/AGPL hard ban)"
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
